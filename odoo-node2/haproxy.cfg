global
    log stdout format raw local0
    maxconn 4096
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    option  http-server-close
    timeout connect 5s
    timeout client  50s
    timeout server  50s
    retries 3

# ============================================================
# Stats HAProxy - accès via http://<ip>:8404/stats
# ============================================================
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats auth admin:haproxy@stats
    stats show-legends

# ============================================================
# Frontend HTTP - Point d'entrée principal
# ============================================================
frontend odoo_http
    bind *:80
    default_backend odoo_servers

    # Rediriger le longpolling vers le backend dédié
    acl is_longpoll path_beg /longpolling
    use_backend odoo_longpoll if is_longpoll

# ============================================================
# Backend Odoo - Instances applicatives
# ============================================================
backend odoo_servers
    balance roundrobin
    option httpchk GET /web/health

    # Sticky sessions via cookie (important pour Odoo)
    cookie SERVERID insert indirect nocache

    # Nœud 1 (AWS EC2 - ajuster l'IP selon votre infra)
    server odoo1 odoo1:8069 check inter 5s rise 2 fall 3 cookie odoo1

    # Nœud 2 (Local ou EC2 - accessible via VPN Pritunl)
    # Remplacer NODE2_VPN_IP par l'IP du nœud 2 dans le tunnel VPN
    server odoo2 NODE2_VPN_IP:8069 check inter 5s rise 2 fall 3 cookie odoo2

# ============================================================
# Backend Longpolling - Notifications temps réel
# ============================================================
backend odoo_longpoll
    balance source
    option httpchk GET /web/health

    server odoo1_lp odoo1:8072 check inter 5s
    server odoo2_lp NODE2_VPN_IP:8072 check inter 5s
